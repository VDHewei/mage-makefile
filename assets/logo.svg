<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- Background: dark rounded card -->
  <rect x="3" y="3" width="294" height="194" rx="24" ry="24" fill="#1a1a2e" stroke="#00ADD8" stroke-width="2"/>

  <!-- === Cute Mole Character === -->
  <g transform="translate(30, 20)">
    <!-- Body: rounded pear shape -->
    <path d="M15,38 C5,38 0,52 0,68 C0,82 8,92 15,95 L130,95 C137,92 145,82 145,68 C145,52 140,38 130,38 Z" fill="#00ADD8"/>

    <!-- Belly patch: lighter color -->
    <path d="M12,48 C6,48 2,58 2,68 C2,78 8,86 12,89 L128,89 C132,86 138,78 138,68 C138,58 134,48 128,48 Z" fill="#7FDBF0" opacity="0.35"/>

    <!-- Head: round and cute -->
    <ellipse cx="70" cy="28" rx="38" ry="26" fill="#00ADD8"/>

    <!-- Ears: small rounded triangles -->
    <path d="M32,12 C26,2 34,-4 44,10 Z" fill="#006F8C"/>
    <path d="M108,12 C114,2 106,-4 96,10 Z" fill="#006F8C"/>
    <!-- Ear inner -->
    <path d="M34,10 C30,2 36,0 41,8 Z" fill="#7FDBF0" opacity="0.4"/>
    <path d="M106,10 C110,2 104,0 99,8 Z" fill="#7FDBF0" opacity="0.4"/>

    <!-- Eyes: big, cute, expressive -->
    <!-- Left eye -->
    <ellipse cx="54" cy="24" rx="10" ry="10" fill="white"/>
    <circle cx="57" cy="23" r="6" fill="#1a1a2e"/>
    <!-- Eye highlight -->
    <ellipse cx="52" cy="21" rx="2.5" ry="2.2" fill="white"/>

    <!-- Right eye -->
    <ellipse cx="86" cy="24" rx="10" ry="10" fill="white"/>
    <circle cx="89" cy="23" r="6" fill="#1a1a2e"/>
    <!-- Eye highlight -->
    <ellipse cx="84" cy="21" rx="2.5" ry="2.2" fill="white"/>

    <!-- Nose: cute oval -->
    <ellipse cx="70" cy="32" rx="4.5" ry="2.5" fill="#1a1a2e"/>

    <!-- Mouth: happy smile -->
    <path d="M62,37 Q70,44 78,37" fill="none" stroke="#1a1a2e" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Blush: cute pink cheeks -->
    <ellipse cx="46" cy="34" rx="5.5" ry="3" fill="#FF6B6B" opacity="0.25"/>
    <ellipse cx="94" cy="34" rx="5.5" ry="3" fill="#FF6B6B" opacity="0.25"/>

    <!-- Arm: left arm reaching up (excited) -->
    <path d="M5,58 C-8,54 -10,42 -4,38" fill="none" stroke="#00ADD8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Arm: right arm holding a small Go badge -->
    <path d="M135,58 C148,54 150,42 144,38" fill="none" stroke="#00ADD8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Go badge: simple G logo -->
    <g transform="translate(138, 36)">
      <!-- Badge background -->
      <rect x="0" y="0" width="24" height="20" rx="3" fill="#2a2a4e" stroke="#00ADD8" stroke-width="1.5"/>
      <!-- Go G logo -->
      <text x="12" y="14" font-family="serif, Georgia" font-size="12" font-weight="bold" fill="#00ADD8" text-anchor="middle" letter-spacing="-0.5">G</text>
    </g>

    <!-- Feet: small rounded -->
    <ellipse cx="36" cy="95" rx="9" ry="4" fill="#006F8C"/>
    <ellipse cx="104" cy="95" rx="9" ry="4" fill="#006F8C"/>
  </g>

  <!-- === Project Name === -->
  <text x="150" y="168" font-family="monospace, 'Courier New', sans-serif" font-size="16" font-weight="bold"
        fill="#F4A261" text-anchor="middle" letter-spacing="1">magego</text>
  <text x="150" y="185" font-family="sans-serif" font-size="10" fill="#8a8aab" text-anchor="middle" letter-spacing="2.5">
    Makefile → magefile
  </text>

  <!-- === Decorative Elements === -->
  <!-- Sparkles/stars around the character -->
  <circle cx="25" cy="55" r="2.5" fill="#2EC866" opacity="0.6"/>
  <circle cx="270" cy="50" r="1.8" fill="#F4A261" opacity="0.6"/>
  <circle cx="90" cy="180" r="2.2" fill="#00ADD8" opacity="0.55"/>
  <circle cx="205" cy="182" r="1.5" fill="#2EC866" opacity="0.5"/>
</svg>
